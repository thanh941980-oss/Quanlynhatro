<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt phòng - Quản lý nhà trọ</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
        background-color: #f5f5f5;
        color: #333;
        line-height: 1.6;
        font-size: 14px;
    }
    
    header {
        background-color: #2c3e50;
        color: white;
        padding: 0.7rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }
    
    .header-title {
        font-size: 1.1rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 50%;
    }
    
    .header-buttons {
        display: flex;
        gap: 8px;
    }
    
    .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 15px;
    }
    
    .form-container {
        background: white;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 15px;
        margin-top: 15px;
    }
    
    .form-group {
        margin-bottom: 0.7rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.3rem;
        font-weight: 500;
        font-size: 0.9rem;
    }
    
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 0.9rem;
    }
    
    .form-row {
        display: flex;
        gap: 15px;
        margin-bottom: 0.7rem;
    }
    
    .form-row .form-group {
        flex: 1;
    }
    
    .btn {
        display: inline-block;
        padding: 0.5rem 1rem;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.3s;
        white-space: nowrap;
    }
    
    .btn:hover {
        background-color: #2980b9;
    }
    
    .back-btn {
        background-color: #7f8c8d;
    }
    
    .back-btn:hover {
        background-color: #95a5a6;
    }
    
    .logout-btn {
        background-color: #e74c3c;
    }
    
    .logout-btn:hover {
        background-color: #c0392b;
    }
    
    .upload-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 0.7rem;
    }
    
    .upload-row {
        display: flex;
        gap: 15px;
        margin-bottom: 0.7rem;
    }
    
    .upload-row .upload-group {
        flex: 1;
    }
    
    .upload-container {
        display: flex;
        flex-direction: column;
        border: 1px dashed #ddd;
        border-radius: 4px;
        padding: 10px;
        background-color: #f9f9f9;
    }
    
    .upload-preview {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .upload-preview img {
        max-width: 100%;
        max-height: 150px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 5px;
    }
    
    .upload-preview .file-name {
        font-size: 0.8rem;
        color: #666;
        text-align: center;
    }
    
    .upload-status {
        font-size: 0.8rem;
        margin-top: 5px;
        text-align: center;
    }
    
    .upload-status.success {
        color: #27ae60;
    }
    
    .upload-status.error {
        color: #e74c3c;
    }
    
    @media (max-width: 768px) {
        header {
            padding: 0.6rem 0.8rem;
        }
        
        .header-title {
            font-size: 1rem;
            max-width: 45%;
        }
        
        .btn {
            padding: 0.45rem 0.8rem;
            font-size: 0.8rem;
        }
    
        .form-row, .upload-row {
            flex-direction: column;
            gap: 10px;
        }
    
        .container {
            padding: 10px;
        }
    
        h2 {
            font-size: 1.1rem;
            text-align: center;
        }
        
        .form-container {
            padding: 12px;
        }
    }
    
    @media (max-width: 480px) {
        .header-title {
            font-size: 0.9rem;
            max-width: 40%;
        }
        
        .btn {
            padding: 0.4rem 0.7rem;
            font-size: 0.75rem;
        }
        
        .header-buttons {
            gap: 5px;
        }
    }
</style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-title">Thuê phòng</div>
            <div class="header-buttons">
                <button onclick="window.location.href='dashboard.html'" class="btn back-btn">Quay lại</button>
                <button id="logoutBtn" class="btn logout-btn">Đăng xuất</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h2>Thông tin đặt phòng</h2>
        
        <div class="form-container">
            <div class="form-row">
                <div class="form-group">
                    <label for="roomSelect">Chọn phòng</label>
                    <select id="roomSelect">
                        <option value="">-- Chọn phòng --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="customerName">Người đặt phòng</label>
                    <input type="text" id="customerName" placeholder="Họ tên người đặt">
                </div>
            </div>
            
            <div class="form-group">
                <label for="sharedCustomers">Người ở chung (nếu có, cách nhau bằng dấu phẩy)</label>
                <input type="text" id="sharedCustomers" placeholder="Người ở chung">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="idNumber">Số CCCD/CMND</label>
                    <input type="text" id="idNumber" placeholder="Số CCCD/CMND">
                </div>
                
                <div class="form-group">
                    <label for="roomPrice">Tiền phòng (VNĐ/tháng)</label>
                    <input type="number" id="roomPrice" placeholder="Tiền phòng">
                </div>
            </div>
            
            <div class="upload-row">
                <div class="upload-group">
                    <label>Ảnh CCCD/CMND mặt trước</label>
                    <div class="upload-container">
                        <input type="file" id="frontIdCard" accept="image/*" style="margin-bottom: 10px;">
                        <button id="uploadFrontBtn" class="btn">Tải lên ảnh mặt trước</button>
                        <div id="frontPreview" class="upload-preview"></div>
                        <div id="frontStatus" class="upload-status"></div>
                    </div>
                </div>
                
                <div class="upload-group">
                    <label>Ảnh CCCD/CMND mặt sau</label>
                    <div class="upload-container">
                        <input type="file" id="backIdCard" accept="image/*" style="margin-bottom: 10px;">
                        <button id="uploadBackBtn" class="btn">Tải lên ảnh mặt sau</button>
                        <div id="backPreview" class="upload-preview"></div>
                        <div id="backStatus" class="upload-status"></div>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="initialElectricity">Chỉ số điện lúc đặt phòng</label>
                    <input type="number" id="initialElectricity" placeholder="Chỉ số điện">
                </div>
                
                <div class="form-group">
                    <label for="initialWater">Chỉ số nước lúc đặt phòng</label>
                    <input type="number" id="initialWater" placeholder="Chỉ số nước">
                </div>
            </div>
            
            <div class="form-group">
                <label for="notes">Ghi chú</label>
                <textarea id="notes" rows="3" placeholder="Ghi chú"></textarea>
            </div>
            
            <button id="saveBtn" class="btn">Lưu thông tin</button>
        </div>
    </div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = { 
            apiKey: "AIzaSyAz38ll5L6nZOicZyQRFtKd0TuzohrLFws",
            authDomain: "quan-ly-nha-tro-2a4bf.firebaseapp.com",
            databaseURL: "https://quan-ly-nha-tro-2a4bf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "quan-ly-nha-tro-2a4bf",
            storageBucket: "quan-ly-nha-tro-2a4bf.firebasestorage.app",
            messagingSenderId: "490747665921",
            appId: "1:490747665921:web:48b0e2bad3a0f894c22a00"
        };

        
        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const storage = firebase.storage();
        
        // Biến lưu thông tin user hiện tại
        let currentUser = null;
        
        // Biến lưu URL của ảnh đã upload
        let frontIdCardUrl = '';
        let backIdCardUrl = '';
        
        // Kiểm tra trạng thái đăng nhập
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                currentUser = user;
                console.log('User ID:', user.uid);
                loadAvailableRooms();
                loadLicenseStatus();
                setupUploadHandlers();
            }
        });
        
        // Tải danh sách phòng trống theo user ID - FIXED
        function loadAvailableRooms() {
            const roomRef = database.ref(`users/${currentUser.uid}/rooms`);
            
            roomRef.once('value')
                .then((snapshot) => {
                    const roomSelect = document.getElementById('roomSelect');
                    roomSelect.innerHTML = '<option value="">-- Chọn phòng --</option>';

                    console.log('Rooms snapshot:', snapshot.val());
                    
                    if (snapshot.exists()) {
                        snapshot.forEach((childSnapshot) => {
                            const room = childSnapshot.val();
                            const roomNumber = childSnapshot.key; // Số phòng là key
                            
                            console.log('Room found:', roomNumber, room);
                            
                            // Chỉ hiển thị phòng có status là 'available'
                            if (room.status === 'available') {
                                const option = document.createElement('option');
                                option.value = roomNumber;
                                option.textContent = `Phòng ${roomNumber} - ${room.price ? room.price.toLocaleString('vi-VN') : '0'} VNĐ`;
                                option.setAttribute("data-price", room.price || 0);
                                roomSelect.appendChild(option);
                            }
                        });
                        
                        // Nếu không có phòng trống nào
                        if (roomSelect.options.length === 1) {
                            const option = document.createElement('option');
                            option.textContent = 'Không có phòng trống';
                            option.disabled = true;
                            roomSelect.appendChild(option);
                        }
                    } else {
                        const option = document.createElement('option');
                        option.textContent = 'Không có phòng nào';
                        option.disabled = true;
                        roomSelect.appendChild(option);
                    }
                })
                .catch((error) => {
                    console.error('Lỗi khi tải phòng:', error);
                    const roomSelect = document.getElementById('roomSelect');
                    roomSelect.innerHTML = '<option value="">-- Lỗi tải phòng --</option>';
                });

            // Khi chọn phòng thì tự điền giá vào ô "Tiền phòng"
            document.getElementById('roomSelect').addEventListener('change', function () {
                const selectedOption = this.options[this.selectedIndex];
                const price = selectedOption.getAttribute("data-price");
                if (price && price !== "0") {
                    document.getElementById('roomPrice').value = price;
                } else {
                    document.getElementById('roomPrice').value = "";
                }
            });
        }
        
        // Thiết lập xử lý upload ảnh
        function setupUploadHandlers() {
            // Xử lý upload ảnh mặt trước
            document.getElementById('uploadFrontBtn').addEventListener('click', () => {
                const fileInput = document.getElementById('frontIdCard');
                const file = fileInput.files[0];
                
                if (!file) {
                    alert('Vui lòng chọn ảnh CCCD mặt trước');
                    return;
                }
                
                // Kiểm tra kích thước file (tối đa 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Kích thước ảnh không được vượt quá 5MB');
                    return;
                }
                
                uploadIdCardImage(file, 'front');
            });
            
            // Xử lý upload ảnh mặt sau
            document.getElementById('uploadBackBtn').addEventListener('click', () => {
                const fileInput = document.getElementById('backIdCard');
                const file = fileInput.files[0];
                
                if (!file) {
                    alert('Vui lòng chọn ảnh CCCD mặt sau');
                    return;
                }
                
                // Kiểm tra kích thước file (tối đa 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Kích thước ảnh không được vượt quá 5MB');
                    return;
                }
                
                uploadIdCardImage(file, 'back');
            });
            
            // Hiển thị preview ngay khi chọn file
            document.getElementById('frontIdCard').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    showLocalPreview(file, 'front');
                }
            });
            
            document.getElementById('backIdCard').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    showLocalPreview(file, 'back');
                }
            });
        }
        
        // Hiển thị preview ảnh từ local (trước khi upload)
        function showLocalPreview(file, side) {
            const previewDiv = side === 'front' ? document.getElementById('frontPreview') : document.getElementById('backPreview');
            const statusDiv = side === 'front' ? document.getElementById('frontStatus') : document.getElementById('backStatus');
            
            // Xóa nội dung cũ
            previewDiv.innerHTML = '';
            statusDiv.innerHTML = '';
            statusDiv.className = 'upload-status';
            
            // Tạo URL object để hiển thị preview
            const objectUrl = URL.createObjectURL(file);
            
            // Tạo và thêm ảnh preview
            const img = document.createElement('img');
            img.src = objectUrl;
            img.alt = `CCCD mặt ${side === 'front' ? 'trước' : 'sau'}`;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '150px';
            img.style.border = '1px solid #ddd';
            img.style.borderRadius = '4px';
            img.style.marginBottom = '5px';
            
            // Tạo và thêm tên file
            const fileName = document.createElement('div');
            fileName.className = 'file-name';
            fileName.textContent = file.name;
            
            previewDiv.appendChild(img);
            previewDiv.appendChild(fileName);
            
            // Hiển thị thông báo chờ upload
            statusDiv.textContent = 'Chưa upload - Vui lòng nhấn nút "Tải lên"';
            statusDiv.className = 'upload-status';
        }
        
        // Upload ảnh CCCD lên Firebase Storage
        function uploadIdCardImage(file, side) {
            const fileName = `${currentUser.uid}_${Date.now()}_${side}.jpg`;
            const storageRef = storage.ref(`id_cards/${fileName}`);
            
            // Hiển thị thông báo đang upload
            const uploadBtn = side === 'front' ? document.getElementById('uploadFrontBtn') : document.getElementById('uploadBackBtn');
            const statusDiv = side === 'front' ? document.getElementById('frontStatus') : document.getElementById('backStatus');
            const originalText = uploadBtn.textContent;
            
            uploadBtn.textContent = 'Đang tải lên...';
            uploadBtn.disabled = true;
            statusDiv.textContent = 'Đang upload...';
            statusDiv.className = 'upload-status';
            
            // Upload file
            const uploadTask = storageRef.put(file);
            
            uploadTask.on('state_changed',
                (snapshot) => {
                    // Theo dõi tiến trình upload
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    statusDiv.textContent = `Đang upload: ${Math.round(progress)}%`;
                },
                (error) => {
                    // Xử lý lỗi
                    console.error('Lỗi khi upload ảnh:', error);
                    statusDiv.textContent = 'Upload thất bại: ' + error.message;
                    statusDiv.className = 'upload-status error';
                    
                    // Khôi phục nút
                    uploadBtn.textContent = originalText;
                    uploadBtn.disabled = false;
                },
                () => {
                    // Upload thành công
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        console.log('URL download:', downloadURL);
                        
                        // Lưu URL vào biến tương ứng
                        if (side === 'front') {
                            frontIdCardUrl = downloadURL;
                        } else {
                            backIdCardUrl = downloadURL;
                        }
                        
                        // Cập nhật preview với URL từ Firebase
                        const previewDiv = side === 'front' ? document.getElementById('frontPreview') : document.getElementById('backPreview');
                        const img = previewDiv.querySelector('img');
                        if (img) {
                            img.src = downloadURL;
                        }
                        
                        // Hiển thị thông báo thành công
                        statusDiv.textContent = 'Upload thành công!';
                        statusDiv.className = 'upload-status success';
                        
                        // Khôi phục nút
                        uploadBtn.textContent = originalText;
                        uploadBtn.disabled = false;
                        
                        console.log(`Upload ảnh mặt ${side === 'front' ? 'trước' : 'sau'} thành công:`, downloadURL);
                    });
                }
            );
        }
        
        // Xử lý lưu thông tin đặt phòng - FIXED
        document.getElementById('saveBtn').addEventListener('click', async () => {
    // Thu thập dữ liệu từ các trường input
    const roomId = document.getElementById('roomSelect').value;
    const customerName = document.getElementById('customerName').value;
    const idNumber = document.getElementById('idNumber').value;
    const roomPrice = document.getElementById('roomPrice').value;
    const initialElectricity = document.getElementById('initialElectricity').value;
    const initialWater = document.getElementById('initialWater').value;
    const notes = document.getElementById('notes').value;
    const sharedCustomers = document.getElementById('sharedCustomers').value.split(',').map(item => item.trim());

    // Kiểm tra các trường bắt buộc
    if (!roomId || !customerName || !idNumber || !roomPrice || !initialElectricity || !initialWater) {
        alert('Vui lòng điền đầy đủ thông tin!');
        return;
    }

    // Kiểm tra đã upload ảnh CCCD chưa
    if (!frontIdCardUrl || !backIdCardUrl) {
        alert('Vui lòng tải lên cả ảnh CCCD mặt trước và mặt sau');
        return;
    }

    // Tạo đối tượng dữ liệu
    const bookingData = {
        roomId: roomId,
        customerName: customerName,
        idNumber: idNumber,
        roomPrice: parseInt(roomPrice),
        initialElectricity: parseInt(initialElectricity),
        initialWater: parseInt(initialWater),
        sharedCustomers: sharedCustomers,
        notes: notes,
        frontIdCardUrl: frontIdCardUrl,
        backIdCardUrl: backIdCardUrl,
        bookingDate: new Date().toISOString(),
        status: 'occupied'
    };

    try {
        // Cập nhật trạng thái phòng thành 'occupied'
        await database.ref(`users/${currentUser.uid}/rooms/${roomId}`).update({
            status: 'occupied'
        });

        // Lưu thông tin đặt phòng vào Firebase
        await database.ref(`users/${currentUser.uid}/bookings`).push(bookingData);

        alert('Đặt phòng thành công!');
        window.location.reload();
    } catch (error) {
        console.error('Lỗi khi đặt phòng:', error);
        alert('Có lỗi xảy ra khi đặt phòng.');
    }
});
        
        // Xử lý đăng xuất
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut()
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    console.error('Lỗi khi đăng xuất:', error);
                });
        });

        // Load trạng thái bản quyền
        function loadLicenseStatus(){
            database.ref(`users/${currentUser.uid}/license`).on('value',snap=>{
                if(snap.exists()&&snap.val().licensed){
                    document.getElementById('licenseStatus').textContent='Đã cấp bản quyền';
                }else{
                    document.getElementById('licenseStatus').textContent='Miễn phí';
                }
            });
        }
    </script>

<footer style="text-align:center; padding:10px; font-size:0.9rem;">
  © <span id="copyrightYear"></span> Quản lý nhà trọ — Bản quyền <strong id="licenseStatus">Miễn phí</strong>
  <div style="font-size:0.75rem; margin-top:4px; color:#666;">
    Nếu đã kích hoạt bản quyền, hệ thống sẽ lưu không giới hạn số phòng.
  </div>
</footer>
<script>
  document.getElementById('copyrightYear').textContent = new Date().getFullYear();
</script>

</body>
</html>
