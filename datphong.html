<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt phòng - Quản lý nhà trọ</title>
<style>
/* CSS giữ nguyên */
* {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
body {background-color:#f5f5f5;color:#333;line-height:1.6;font-size:14px;}
header {background-color:#2c3e50;color:white;padding:0.7rem 1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.header-content {display:flex;justify-content:space-between;align-items:center;width:100%;}
.header-title {font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%;}
.header-buttons {display:flex;gap:8px;}
.container {max-width:1000px;margin:0 auto;padding:15px;}
.form-container {background:white;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1);padding:15px;margin-top:15px;}
.form-group {margin-bottom:0.7rem;}
.form-group label {display:block;margin-bottom:0.3rem;font-weight:500;font-size:0.9rem;}
.form-group input,.form-group select,.form-group textarea {width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:4px;font-size:0.9rem;}
.form-row {display:flex;gap:15px;margin-bottom:0.7rem;}
.form-row .form-group {flex:1;}
.btn {display:inline-block;padding:0.5rem 1rem;background-color:#3498db;color:white;border:none;border-radius:4px;font-size:0.85rem;cursor:pointer;transition:background-color 0.3s;white-space:nowrap;}
.btn:hover {background-color:#2980b9;}
.btn:disabled {background-color:#95a5a6;cursor:not-allowed;}
.back-btn {background-color:#7f8c8d;}
.back-btn:hover {background-color:#95a5a6;}
.logout-btn {background-color:#e74c3c;}
.logout-btn:hover {background-color:#c0392b;}
.cccd-preview {width:100%;max-width:250px;margin-top:8px;border:1px solid #ccc;border-radius:4px;display:none;}
.required-field::after {content: " *"; color: red;}
.loading {display: none; text-align: center; margin: 10px 0;}
.loading-spinner {border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 0 auto;}
@keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}
.alert {padding:10px;margin:10px 0;border-radius:4px;}
.alert-success {background-color:#d4edda;color:#155724;border:1px solid #c3e6cb;}
.alert-error {background-color:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
.optional-note {font-size:0.8rem;color:#666;font-style:italic;}
.file-size-warning {font-size:0.75rem;color:#e67e22;margin-top:5px;}
@media(max-width:768px){.form-row{flex-direction:column;gap:10px;}}
</style>

<!-- CHỈ import Auth và Database, KHÔNG import Storage -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>

<body>
<header>
  <div class="header-content">
    <div class="header-title">Thuê phòng</div>
    <div class="header-buttons">
      <button onclick="window.location.href='dashboard.html'" class="btn back-btn">Quay lại</button>
      <button id="logoutBtn" class="btn logout-btn">Đăng xuất</button>
    </div>
  </div>
</header>

<div class="container">
<h2>Thông tin đặt phòng</h2>
<div class="form-container">
  
  <div id="alertMessage"></div>

  <div class="form-row">
    <div class="form-group">
      <label for="roomSelect" class="required-field">Chọn phòng</label>
      <select id="roomSelect"><option value="">-- Chọn phòng --</option></select>
    </div>
    <div class="form-group">
      <label for="customerName" class="required-field">Người đặt phòng</label>
      <input type="text" id="customerName" placeholder="Họ tên người đặt">
    </div>
  </div>

  <div class="form-group">
    <label for="sharedCustomers">Người ở chung (nếu có, cách nhau bằng dấu phẩy)</label>
    <input type="text" id="sharedCustomers" placeholder="Người ở chung">
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="idNumber" class="required-field">Số CCCD/CMND</label>
      <input type="text" id="idNumber" placeholder="Số CCCD/CMND">
    </div>
    <div class="form-group">
      <label for="roomPrice">Tiền phòng (VNĐ/tháng)</label>
      <input type="number" id="roomPrice" placeholder="Tiền phòng">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="initialElectricity">Chỉ số điện lúc đặt phòng</label>
      <input type="number" id="initialElectricity" placeholder="Chỉ số điện" value="0">
    </div>
    <div class="form-group">
      <label for="initialWater">Chỉ số nước lúc đặt phòng</label>
      <input type="number" id="initialWater" placeholder="Chỉ số nước" value="0">
    </div>
  </div>

  <!-- Mặt trước CCCD -->
  <div class="form-group">
    <label>Ảnh thẻ CCCD mặt trước <span class="optional-note">(Tùy chọn)</span></label>
    <input type="file" id="frontCCCD" accept="image/*">
    <div class="file-size-warning">Lưu ý: Ảnh lớn có thể làm chậm ứng dụng</div>
    <img id="frontPreview" class="cccd-preview" alt="Mặt trước CCCD">
  </div>

  <!-- Mặt sau CCCD -->
  <div class="form-group">
    <label>Ảnh thẻ CCCD mặt sau <span class="optional-note">(Tùy chọn)</span></label>
    <input type="file" id="backCCCD" accept="image/*">
    <div class="file-size-warning">Lưu ý: Ảnh lớn có thể làm chậm ứng dụng</div>
    <img id="backPreview" class="cccd-preview" alt="Mặt sau CCCD">
  </div>

  <div class="form-group">
    <label for="notes">Ghi chú</label>
    <textarea id="notes" rows="3" placeholder="Ghi chú"></textarea>
  </div>

  <div class="loading" id="loadingIndicator">
    <div class="loading-spinner"></div>
    <p>Đang xử lý...</p>
  </div>

  <button id="saveBtn" class="btn">Lưu thông tin</button>

</div>
</div>

<footer style="text-align:center;padding:10px;font-size:0.9rem;">
© <span id="copyrightYear"></span> Quản lý nhà trọ — Bản quyền <strong id="licenseStatus">Miễn phí</strong>
</footer>

<script>
// Hiển thị thông báo
function showAlert(message, type) {
  const alertDiv = document.getElementById('alertMessage');
  alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  setTimeout(() => {
    alertDiv.innerHTML = '';
  }, 5000);
}

// Firebase Config KHÔNG CÓ storageBucket
const firebaseConfig = {
  apiKey: "AIzaSyAz38ll5L6nZOicZyQRFtKd0TuzohrLFws",
  authDomain: "quan-ly-nha-tro-2a4bf.firebaseapp.com",
  databaseURL: "https://quan-ly-nha-tro-2a4bf-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quan-ly-nha-tro-2a4bf",
  // ĐÃ XÓA storageBucket
  messagingSenderId: "490747665921",
  appId: "1:490747665921:web:48b0e2bad3a0f894c22a00"
};

// Khởi tạo Firebase (CHỈ Database và Auth)
try {
  firebase.initializeApp(firebaseConfig);
  console.log("Firebase initialized WITHOUT Storage");
} catch (error) {
  console.log("Firebase already initialized");
}

const auth = firebase.auth();
const database = firebase.database();
// KHÔNG khởi tạo storage

let currentUser = null;

// Kiểm tra trạng thái đăng nhập
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = 'index.html';
  } else {
    currentUser = user;
    console.log("User logged in:", user.uid);
    loadAvailableRooms();
  }
});

// Tải danh sách phòng trống
function loadAvailableRooms() {
  const ref = database.ref(`users/${currentUser.uid}/rooms`);
  
  ref.once('value').then(snap => {
    const roomSelect = document.getElementById('roomSelect');
    roomSelect.innerHTML = '<option value="">-- Chọn phòng --</option>';
    
    if (snap.exists()) {
      snap.forEach(c => {
        const room = c.val(); 
        const num = c.key;
        if (room.status === 'available') {
          const op = document.createElement('option');
          op.value = num;
          op.textContent = `Phòng ${num} - ${room.price ? room.price.toLocaleString() : 0} VNĐ`;
          op.setAttribute("data-price", room.price || 0);
          roomSelect.appendChild(op);
        }
      });
    } else {
      console.log("No rooms found for user");
    }
  }).catch(error => {
    console.error("Lỗi khi tải danh sách phòng:", error);
    showAlert("Không thể tải danh sách phòng. Vui lòng thử lại.", "error");
  });
  
  // Cập nhật giá phòng khi chọn phòng
  document.getElementById('roomSelect').addEventListener('change', function () {
    const selectedOption = this.options[this.selectedIndex];
    const p = selectedOption.getAttribute("data-price");
    document.getElementById('roomPrice').value = p || "";
  });
}

// Chuyển ảnh thành Base64 (giới hạn kích thước)
function imageToBase64(file, maxSizeKB = 300) {
  return new Promise((resolve, reject) => {
    if (!file) {
      resolve('');
      return;
    }

    // Kiểm tra kích thước file
    if (file.size > maxSizeKB * 1024) {
      showAlert(`Ảnh ${file.name} quá lớn (>${maxSizeKB}KB). Vui lòng chọn ảnh nhỏ hơn.`, "error");
      // Reset file input
      resolve('');
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      resolve(reader.result);
    };
    reader.onerror = (error) => {
      console.error("Lỗi đọc file:", error);
      resolve(''); // Vẫn tiếp tục dù không đọc được ảnh
    };
    reader.readAsDataURL(file);
  });
}

// Hiển thị ảnh xem trước
document.getElementById('frontCCCD').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = () => {
      frontPreview.src = reader.result;
      frontPreview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  } else {
    frontPreview.style.display = 'none';
  }
});

document.getElementById('backCCCD').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = () => {
      backPreview.src = reader.result;
      backPreview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  } else {
    backPreview.style.display = 'none';
  }
});

// Bắt sự kiện lưu
document.getElementById('saveBtn').addEventListener('click', async () => {
  console.log("Bắt đầu lưu thông tin...");
  
  const roomId = document.getElementById('roomSelect').value;
  const customerName = document.getElementById('customerName').value;
  const idNumber = document.getElementById('idNumber').value;
  const roomPrice = document.getElementById('roomPrice').value;
  const initialElectricity = document.getElementById('initialElectricity').value;
  const initialWater = document.getElementById('initialWater').value;
  const notes = document.getElementById('notes').value;
  const sharedCustomers = document.getElementById('sharedCustomers').value.split(',').map(x => x.trim()).filter(x => x !== '');
  
  console.log("Dữ liệu form:", { roomId, customerName, idNumber });
  
  // Kiểm tra các trường bắt buộc
  if (!roomId || !customerName || !idNumber) {
    const missing = [];
    if (!roomId) missing.push("phòng");
    if (!customerName) missing.push("tên người đặt");
    if (!idNumber) missing.push("số CCCD");
    
    showAlert(`Vui lòng điền đầy đủ các thông tin bắt buộc: ${missing.join(", ")}`, "error");
    return;
  }
  
  // Hiển thị loading
  const loadingIndicator = document.getElementById('loadingIndicator');
  const saveBtn = document.getElementById('saveBtn');
  loadingIndicator.style.display = 'block';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Đang xử lý...';
  
  try {
    const frontFile = document.getElementById('frontCCCD').files[0];
    const backFile = document.getElementById('backCCCD').files[0];
    
    console.log("Files:", { frontFile: !!frontFile, backFile: !!backFile });
    
    // Chuyển ảnh thành Base64 (nếu có)
    let frontBase64 = '', backBase64 = '';
    
    if (frontFile) {
      console.log("Converting front image to Base64...");
      frontBase64 = await imageToBase64(frontFile);
    }
    
    if (backFile) {
      console.log("Converting back image to Base64...");
      backBase64 = await imageToBase64(backFile);
    }
    
    console.log("Base64 conversion completed");
    
    // Chuẩn bị dữ liệu
    const data = {
      roomId,
      customerName,
      idNumber,
      roomPrice: parseInt(roomPrice) || 0,
      initialElectricity: parseInt(initialElectricity) || 0,
      initialWater: parseInt(initialWater) || 0,
      sharedCustomers,
      notes,
      cccdFront: frontBase64, // Lưu Base64
      cccdBack: backBase64,   // Lưu Base64
      bookingDate: new Date().toISOString(),
      status: 'occupied'
    };
    
    console.log("Data to save:", { 
      ...data, 
      cccdFront: frontBase64 ? `Base64 (${frontBase64.length} chars)` : 'empty',
      cccdBack: backBase64 ? `Base64 (${backBase64.length} chars)` : 'empty'
    });
    
    // Cập nhật trạng thái phòng
    console.log("Updating room status...");
    const roomUpdate = {
      status: 'occupied',
      customerName: customerName,
      idNumber: idNumber,
      price: parseInt(roomPrice) || 0,
      lastUpdated: new Date().toISOString()
    };
    
    await database.ref(`users/${currentUser.uid}/rooms/${roomId}`).update(roomUpdate);
    console.log("Room status updated");
    
    // Lưu thông tin đặt phòng
    console.log("Saving booking data...");
    await database.ref(`users/${currentUser.uid}/bookings`).push(data);
    console.log("Booking data saved");
    
    showAlert('Đặt phòng thành công! Đang chuyển hướng...', 'success');
    
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1500);
    
  } catch (error) {
    console.error('Lỗi khi lưu thông tin:', error);
    showAlert('Lỗi: ' + error.message, 'error');
  } finally {
    // Ẩn loading và kích hoạt lại nút
    loadingIndicator.style.display = 'none';
    saveBtn.disabled = false;
    saveBtn.textContent = 'Lưu thông tin';
  }
});

// Đăng xuất
document.getElementById('logoutBtn').addEventListener('click', () => {
  auth.signOut().then(() => {
    window.location.href = 'index.html';
  });
});

// Hiển thị năm
document.getElementById('copyrightYear').textContent = new Date().getFullYear();
</script>
</body>
</html>
